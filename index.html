<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>Quiz | Bellash Academy</title>
  <meta name="description" content="Faça o quiz da Bellash Academy com Larissa Monteiro e descubra o caminho ideal para você no universo dos cílios.">
  <link rel="canonical" href="https://SEU-DOMINIO.com.br/">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#862D59">

  <!-- Open Graph / redes sociais -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Bellash Academy">
  <meta property="og:title" content="Bellash Academy | Extensão de Cílios com Larissa Monteiro">
  <meta property="og:description" content="Faça o quiz e descubra o caminho ideal para você no universo dos cílios.">
  <meta property="og:url" content="https://SEU-DOMINIO.com.br/">
  <meta property="og:image" content="https://SEU-DOMINIO.com.br/img/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Ícones e manifest -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Fontes (design system: Cormorant Garamond + DM Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Estilos e scripts do quiz (pasta quiz/, empacotados pelo Vite no build) -->
  <link rel="stylesheet" href="./quiz/css/base.css">
  <link rel="stylesheet" href="./quiz/css/style.css">
  <link rel="stylesheet" href="./quiz/css/quiz.css">
  <script type="module" src="./quiz/js/index.js"></script>
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="./" aria-label="Bellash Academy — início">
        <img src="/img/logo.svg" alt="Bellash Academy" width="220" height="46">
      </a>
    </div>
  </header>

  <main id="conteudo">
    <!-- QUIZ: abre direto na 1ª pergunta (quiz/js/quiz.js + quiz/js/quiz-data.js) -->
    <section class="section section--quiz" id="quiz" aria-labelledby="quiz-title">
      <div class="container container--quiz">
        <h1 class="visually-hidden" id="quiz-title">Quiz Bellash Academy</h1>
        <div class="quiz" data-quiz>
          <noscript>Ative o JavaScript para fazer o quiz.</noscript>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span data-year></span> Bellash Academy. Todos os direitos reservados.</p>
    </div>
  </footer>
</body>
</html>
