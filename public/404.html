<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada | Bellash Academy</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: "DM Sans", Arial, sans-serif;
      color: #231D21;
      background: linear-gradient(180deg, #FFF6FA, #FFFFFF);
      text-align: center;
    }
    img { width: 150px; height: auto; margin: 0 auto 32px; }
    p.eyebrow { color: #862D59; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; }
    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 34px; line-height: 1.08; margin: 8px 0 12px; }
    p { color: #50454B; font-size: 15px; line-height: 1.55; }
    a.btn {
      display: inline-flex; align-items: center; min-height: 48px; margin-top: 24px; padding: 0 24px;
      border-radius: 12px; background: #862D59; color: #fff; font-weight: 700; text-decoration: none;
    }
    a.btn:hover { background: #71344F; }
  </style>
</head>
<body>
  <main>
    <img src="/img/logo.svg" alt="Bellash Academy" width="274" height="60">
    <p class="eyebrow">ERRO 404</p>
    <h1>Página não encontrada</h1>
    <p>O endereço que você procurou não existe ou foi movido.</p>
    <a class="btn" href="/">Voltar para o início</a>
  </main>
</body>
</html>
